<table id="board"></table>
<p id="msg"></p>

<script src="https://cdn.jsdelivr.net/npm/@microsoft/signalr@8.0.0/dist/browser/signalr.min.js"></script>
<script>
  const board = document.getElementById('board');

  // ── build a 3 × 3 grid ────────────────────────────────────────────────
  for (let r = 0; r < 3; r++) {
    const tr = board.insertRow();
    for (let c = 0; c < 3; c++) {
      const idx = r * 3 + c;                    // 0‥8
      const td = tr.insertCell();
      td.id = `c${idx}`;
      td.className = 'cell';
    }
  }
  // ───────────────────────────────────────────────────────────────────────

  let myMark, turn;

  const hub = new signalR.HubConnectionBuilder()
    .withUrl('/play')
    .withAutomaticReconnect()
    .build();

  hub.on('start', p => {
    myMark = myMark ? 'O' : 'X';        // first tab gets X, second gets O
    turn = p.turn;                    // should be "X" at game start
    document.querySelectorAll('.cell').forEach(td => td.textContent = '');
    msg(`Game started: you are ${myMark}`);
  });

  hub.on('update', u => {
    u.board.forEach((v, i) =>
      document.getElementById('c' + i).textContent = v ?? '');
    turn = u.turn;
  });

  hub.on('result', r =>
    msg(r === 'draw' ? 'Draw!' : `${r} wins!`));

  // click handler (one per table, cheap!)
  board.addEventListener('click', e => {
    if (e.target?.className !== 'cell') return;
    const idx = +e.target.id.slice(1);           // "c4" → 4
    if (turn === myMark) hub.invoke('Move', idx);
  });

  function msg(t) { document.getElementById('msg').textContent = t; }

  hub.start();
</script>

<style>
  table {
    border-collapse: collapse;
    margin: 40px auto;
  }

  .cell {
    width: 80px;
    height: 80px;
    border: 1px solid #333;
    text-align: center;
    font: 48px/80px monospace;
    cursor: pointer;
  }

  #msg {
    text-align: center;
    font: 18px sans-serif;
  }
</style>
