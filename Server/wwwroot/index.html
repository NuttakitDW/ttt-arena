<!DOCTYPE html><meta charset="utf-8">
<table id="board"></table><p id="msg"></p>

<script src="https://cdn.jsdelivr.net/npm/@microsoft/signalr@8.0.0/dist/browser/signalr.min.js"></script>
<script>
const board = document.getElementById('board');
for (let i = 0; i < 9; i++)
  board.insertAdjacentHTML('beforeend', `<td id="c${i}"></td>`);

let myMark, turn;

const hub = new signalR.HubConnectionBuilder()
  .withUrl('/play')
  .withAutomaticReconnect()
  .build();

hub.on('start', p => {
  // first connection in the room gets X, the second gets O
  myMark = myMark ? 'O' : 'X';
  turn = p.turn;
  document.querySelectorAll('td').forEach(td => td.textContent = '');
  msg(`Game started – you are ${myMark}`);
});

hub.on('update', u => {
  u.board.forEach((v, i) =>
    document.getElementById('c' + i).textContent = v ?? '');
  turn = u.turn;
});

hub.on('result', r =>
  msg(r === 'draw' ? 'Draw!' : `${r} wins!`));

board.onclick = e => {
  const i = e.target?.id?.slice(1);
  if (i == null) return;
  if (turn === myMark) hub.invoke('Move', +i);
};

function msg(t) { document.getElementById('msg').textContent = t; }

hub.start();
</script>

<style>
table { border-collapse: collapse; margin: 40px auto; }
td    { width: 60px; height: 60px; border: 1px solid #333;
        text-align: center; font: 40px/60px monospace; cursor: pointer; }
#msg  { text-align: center; font: 18px sans-serif; }
</style>
